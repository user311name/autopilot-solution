<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | AutoPilot Solutions</title>
<link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header class="header">
<div class="container nav">
<a href="../index.html" class="logo">
<div class="logo-mark">◯⌁</div>
<div class="logo-text">AUTOPILOT<span>SOLUTIONS</span></div>
</a>

<nav class="nav-links">
<a href="../index.html">Accueil</a>
<a href="services.html">Services</a>
<a href="pour-qui.html">Pour qui ?</a>
<a href="pourquoi-nous.html">Pourquoi nous ?</a>
<a href="tarifs.html">Tarifs</a>
<a href="contact.html" class="active btn btn-primary">Demander un devis</a>
</nav>

<button class="menu-btn">☰</button>
</div>
</header>

<main>

<section class="page-hero">
<div class="container">
<div class="eyebrow">CONTACT</div>

<h1>
PARLONS DE VOTRE
<span class="gradient">PROJET.</span>
</h1>

<p>
Expliquez-nous ce qui vous fait perdre du temps.
Nous verrons ensemble ce qui peut être automatisé.
</p>
</div>
</section>

<section>
<div class="container">

<div class="form-wrapper">

<form id="contact-form">

<div class="form-grid">

<div class="field">
<label for="prenom">Prénom *</label>
<input id="prenom" name="prenom" required>
</div>

<div class="field">
<label for="nom">Nom *</label>
<input id="nom" name="nom" required>
</div>

<div class="field">
<label for="entreprise">Entreprise</label>
<input id="entreprise" name="entreprise">
</div>

<div class="field">
<label for="telephone">Téléphone</label>
<input id="telephone" name="telephone" type="tel">
</div>

<div class="field full">
<label for="email">Email *</label>
<input id="email" name="email" type="email" required>
</div>

<div class="field full">
<label for="service">Service recherché</label>

<select id="service" name="service">
<option value="">Sélectionnez</option>
<option>Automatisation des emails</option>
<option>Relances</option>
<option>Rendez-vous</option>
<option>Gestion des demandes</option>
<option>Reporting</option>
<option>Automatisation sur mesure</option>
</select>
</div>

<div class="field full">
<label for="message">Votre besoin *</label>
<textarea id="message" name="message"
placeholder="Expliquez-nous simplement ce que vous souhaitez automatiser..."
required></textarea>
</div>

<div class="field full">
<label>
<input type="checkbox" name="rappel" style="width:auto;">
 Je souhaite être rappelé
</label>
</div>

</div>

<br>

<button type="submit" class="btn btn-primary">
Demander mon devis →
</button>

<p id="form-message" style="margin-top:20px;"></p>

</form>

</div>

</div>
</section>

</main>

<footer>
<div class="container copyright">
© 2026 AutoPilot Solutions — Tous droits réservés.
</div>
</footer>

<button class="top">↑</button>
<script src="../js/script.js"></script>

</body>
</html>
